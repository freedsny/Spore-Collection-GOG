# Builds this fork's APKs on GitHub: the Java side from this repo, the native libraries from an official release of
# VinTeRuS/spore-re (android/build-fork-apk.sh). The APKs are published as a release of this repo, ready to download
# on the phone.
name: APK del fork

on:
  push:
    branches: [master]
    paths: ['android/**', '.github/workflows/fork-apk.yml']
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Release oficial del que se toman las librerías nativas (vacío = el último)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      SDL2_TAG: release-2.30.9  # the same as android/build-deps.sh
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_ENV"

      - name: Official APKs
        run: |
          tag="${{ inputs.upstream_tag }}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo VinTeRuS/spore-re --json tagName -q .tagName)
          fi
          echo "UPSTREAM_TAG=$tag" >> "$GITHUB_ENV"
          mkdir -p upstream
          gh release download "$tag" --repo VinTeRuS/spore-re --pattern '*.apk' --dir upstream
          ls -la upstream

      - name: SDL2 sources
        run: git clone -q --depth 1 --branch "$SDL2_TAG" https://github.com/libsdl-org/SDL.git build/sdl

      - name: Build
        run: android/build-fork-apk.sh upstream/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/fork-apk/*.apk

      - name: Release
        run: |
          tag="fork-${{ github.run_number }}"
          {
            echo "APK del fork (commit ${GITHUB_SHA::7}), librerías nativas de VinTeRuS/spore-re $UPSTREAM_TAG."
            echo
            echo "- \`Spore-Collection-GOG.apk\`: Vulkan 1.3 (la mayoría de teléfonos)."
            echo "- \`Spore-Collection-GOG-vk11.apk\`: Vulkan 1.1 (GPUs viejas)."
            echo
            echo "Se instala al lado de la app oficial (otro nombre: com.sporere.game.freed)."
          } > notes.md
          gh release create "$tag" build/fork-apk/*.apk --title "Spore Collection GOG $tag" --notes-file notes.md --target "$GITHUB_SHA"
