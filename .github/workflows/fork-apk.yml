# Builds this fork's APKs on GitHub: the Java side from this repo, the native libraries from an official release of
# VinTeRuS/spore-re (android/build-fork-apk.sh). The APKs are published as a release of this repo, ready to download
# on the phone.
name: APK Spore Collection GOG

on:
  push:
    branches: [master]
    paths: ['android/**', '.github/workflows/fork-apk.yml']
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Release oficial del que se toman las librerías nativas (vacío = el último)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      SDL2_TAG: release-2.30.9  # the same as android/build-deps.sh
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_ENV"

      - name: Official APKs
        run: |
          tag="${{ inputs.upstream_tag }}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo VinTeRuS/spore-re --json tagName -q .tagName)
          fi
          echo "UPSTREAM_TAG=$tag" >> "$GITHUB_ENV"
          mkdir -p upstream
          gh release download "$tag" --repo VinTeRuS/spore-re --pattern '*.apk' --dir upstream
          ls -la upstream

      - name: SDL2 sources
        run: git clone -q --depth 1 --branch "$SDL2_TAG" https://github.com/libsdl-org/SDL.git build/sdl

      - name: Build
        run: |
          echo "APK_BASE=Spore-Collection-GOG-$UPSTREAM_TAG-n${{ github.run_number }}" >> "$GITHUB_ENV"
          APK_PREFIX="Spore-Collection-GOG-$UPSTREAM_TAG-n${{ github.run_number }}" android/build-fork-apk.sh upstream/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/fork-apk/*.apk

      # Named like the OpenCE releases: tag spore-<date>-<time> (Bogota), title with the game, the official version
      # the native libraries come from and the build number, the commit's message under "Cambios".
      - name: Release
        run: |
          tag="spore-$(TZ=America/Bogota date +%Y%m%d-%H%M)"
          title="Spore Collection GOG - spore-re $UPSTREAM_TAG (#${{ github.run_number }})"
          {
            echo "APK de Spore Collection GOG (librerías nativas de spore-re $UPSTREAM_TAG, de VinTeRuS)."
            echo "Teclado: botón ⌨. Tamaño de pantalla: ⚙ > Gráficos > Tamaño de pantalla (aplica al reiniciar)."
            echo
            echo "- \`$APK_BASE.apk\`: Vulkan 1.3 (la mayoría de teléfonos)."
            echo "- \`$APK_BASE-vk11.apk\`: Vulkan 1.1 (GPUs viejas)."
            echo
            echo "## Cambios"
            git log -1 --format=%B | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:'
          } > notes.md
          gh release create "$tag" build/fork-apk/*.apk --title "$title" --notes-file notes.md --target "$GITHUB_SHA"
